name: Deploy Caddy Gateway

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy files to Hetzner VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,Caddyfile"
          target: "/opt/caddy"

      - name: Start Caddy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/caddy
            # Ensure the sites directory exists with -p to avoid errors if it already exists
            mkdir -p sites 
            # Create the caddy_net network if it doesn't exist with 2>/dev/null to suppress errors if it already exists
            docker network create caddy_net 2>/dev/null || true
            docker compose pull
            docker compose up -d
            # Reload Caddy to apply the new configuration
            docker exec caddy-gateway caddy reload --config /etc/caddy/Caddyfile