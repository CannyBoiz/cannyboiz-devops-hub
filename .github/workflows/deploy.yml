# Runs the Fleet playbook: prepares every VPS and deploys the Gateway (ADR 0002)
name: Prepare the Fleet and deploy the Gateway

on:
  push:
    branches:
      - main
    paths:
      - fleet/ansible/**
      - fleet/gateway/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

# Two runs at once would race their Gateway restarts on the same VPS
concurrency:
  group: fleet

jobs:
  deploy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: fleet/ansible
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Ansible and the collections
        # requests and python-dateutil: the hcloud inventory's vendored client needs them
        run: |
          pip install ansible-core==2.21.6 requests python-dateutil
          ansible-galaxy collection install -r requirements.yml

      - name: Run the playbook
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN_READONLY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ANSIBLE_HOST_KEY_CHECKING: "False" # pinning is #3
        run: |
          key="$RUNNER_TEMP/fleet_ci"
          (umask 077 && printf '%s\n' "$SSH_PRIVATE_KEY" > "$key")
          ansible-playbook playbook.yml --private-key "$key"
